# Gateway → API over mutual TLS 1.3. The gateway presents a CA-issued client
# certificate; the API rejects any connection without one (zero trust east-west).
proxy_pass https://api_upstream;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# Overwrite (never append) client-supplied forwarding headers to prevent IP spoofing.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Request-Id $request_id;

proxy_ssl_certificate         /etc/nginx/certs/tls.crt;
proxy_ssl_certificate_key     /etc/nginx/certs/tls.key;
proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
proxy_ssl_verify on;
proxy_ssl_verify_depth 2;
proxy_ssl_name api;
proxy_ssl_server_name on;
proxy_ssl_protocols TLSv1.3;
proxy_ssl_session_reuse on;

proxy_connect_timeout 5s;
# proxy_read_timeout uses the 60s default; the SSE location overrides it.
proxy_hide_header X-Powered-By;
# The gateway is authoritative for browser security headers; drop the API's copies
# to avoid duplicates (the API still sends them when reached directly).
proxy_hide_header Strict-Transport-Security;
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header Cross-Origin-Resource-Policy;
proxy_hide_header X-Permitted-Cross-Domain-Policies;
