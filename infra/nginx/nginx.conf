# Hardened NGINX gateway — TLS 1.3 only, HSTS, strict CSP, mTLS to the API.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  log_format json escape=json '{"ts":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
                              '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
                              '"rt":$request_time,"ua":"$http_user_agent","rid":"$request_id"}';
  access_log /dev/stdout json;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  client_max_body_size 1m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  send_timeout 30s;
  large_client_header_buffers 4 16k;

  # Abuse protection. The per-IP request zones (api, auth) and the canonical-host map are
  # rendered at container start from the deployment profile (40-ciso-runtime.sh); per-user
  # quotas are enforced by the API and are administrator-defined at runtime.
  include /tmp/nginx-runtime/http-*.conf;
  limit_conn_zone $binary_remote_addr zone=conn:10m;
  limit_req_status 429;
  limit_conn_status 429;

  # Re-resolve upstream names (Docker embedded DNS) so a recreated api/keycloak
  # container with a new IP is picked up without restarting the gateway.
  # valid=1s: a recreated container is reachable within a second (Docker DNS is local, so
  # the lookup cost is negligible). A longer TTL left a 502 window after each redeploy.
  resolver 127.0.0.11 valid=1s ipv6=off;
  resolver_timeout 3s;

  upstream api_upstream {
    zone api_upstream 64k;
    server api:8443 resolve;
    keepalive 16;
  }
  upstream idp_upstream {
    zone idp_upstream 64k;
    server keycloak:8443 resolve;
    keepalive 8;
  }

  # ---- Plain HTTP: health probe + redirect everything else to HTTPS ----------
  server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok"; }
    location / { return 301 https://$host$request_uri; }
  }

  # ---- HTTPS -----------------------------------------------------------------
  server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.3;
    ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256;
    ssl_ecdh_curve X25519:secp384r1:secp256r1;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    limit_conn conn 50;

    # Trusted load balancers (real client IP) and redirect of alternative names to the
    # canonical public URL — rendered from the deployment profile.
    include /tmp/nginx-runtime/server-*.conf;

    include /etc/nginx/security-headers.conf;

    # Block dotfiles and common probe paths
    location ~ /\.(?!well-known) { return 404; }

    # Internal API endpoints are never reachable from outside the gateway.
    location ^~ /api/internal/ { return 404; }

    # Source-network policy checks (auth_request): the API evaluates the administrator-
    # defined allowlists, so changes apply without reloading NGINX.
    location = /_ipgate/app {
      internal;
      proxy_pass https://api_upstream/api/internal/ip-gate/app;
      include /etc/nginx/proxy-api-common.conf;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
    }
    location = /_ipgate/admin {
      internal;
      proxy_pass https://api_upstream/api/internal/ip-gate/admin-console;
      include /etc/nginx/proxy-api-common.conf;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
    }

    # Real-time SSE stream (unbuffered, long-lived)
    location = /api/stream {
      include /etc/nginx/proxy-api.conf;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
    }

    location /api/auth/ {
      limit_req zone=auth burst=40 nodelay;
      include /etc/nginx/proxy-api.conf;
    }

    location /api/ {
      limit_req zone=api burst=100 nodelay;
      include /etc/nginx/proxy-api.conf;
    }

    # Keycloak admin console: always reachable from the Docker host (SSH tunnel), plus
    # any networks the administrator adds under Configuration → Network access.
    location /auth/admin/ {
      satisfy any;
      allow 127.0.0.1;
      allow 172.30.0.1;
      deny all;
      auth_request /_ipgate/admin;
      proxy_pass https://idp_upstream;
      include /etc/nginx/proxy-idp.conf;
    }

    # Identity provider static assets (no policy sub-request per file).
    location /auth/resources/ {
      proxy_pass https://idp_upstream;
      include /etc/nginx/proxy-idp.conf;
    }

    # Identity provider (OIDC endpoints and login pages). Keycloak sets its own CSP.
    # Sign-in is limited to the administrator-defined client networks.
    location /auth/ {
      limit_req zone=auth burst=60 nodelay;
      auth_request /_ipgate/app;
      proxy_pass https://idp_upstream;
      include /etc/nginx/proxy-idp.conf;
    }

    # Immutable hashed assets
    location /assets/ {
      root /usr/share/nginx/html;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # SPA
    location / {
      root /usr/share/nginx/html;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store" always;
      try_files $uri /index.html;
    }
  }
}
